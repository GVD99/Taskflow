<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow – Director Economic</title>
<style>
:root { color-scheme: light;
  --bg:#f6f7f9; --card:#ffffff; --ink:#1a2332; --muted:#6b7280; --line:#e5e7eb;
  --red:#dc2626; --red-bg:#fef2f2; --amber:#d97706; --amber-bg:#fffbeb;
  --green:#059669; --green-bg:#ecfdf5; --blue:#2563eb; --blue-bg:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding:16px;max-width:1100px;margin:0 auto}
.wide2{display:block}.qa-toggle{display:none}.qa-more{display:contents}
.t-title.editing input{width:100%;font-weight:500;padding:4px 8px}
.task{touch-action:pan-y;position:relative;transition:transform .15s}.task.swipe-r{background:var(--green-bg)}.task.swipe-l{background:var(--amber-bg)}
@media(min-width:1250px){body{max-width:1500px}.wide2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}.wide2>div>.card:first-child{margin-top:0}}
h1{font-size:18px;font-weight:700}
h2{font-size:14px;font-weight:600;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.b-red{background:var(--red-bg);color:var(--red)} .b-amber{background:var(--amber-bg);color:var(--amber)}
.b-green{background:var(--green-bg);color:var(--green)} .b-blue{background:var(--blue-bg);color:var(--blue)}
.b-gray{background:#f3f4f6;color:var(--muted)}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task.alerted{background:var(--red-bg);border-radius:8px;margin:2px 0;padding:9px 8px}
.chk{width:18px;height:18px;min-width:18px;border:2px solid #cbd5e1;border-radius:50%;cursor:pointer;margin-top:1px}
.chk:hover{border-color:var(--green);background:var(--green-bg)}
.t-title{font-weight:500;line-height:1.35}
.t-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.t-body{flex:1;min-width:0}
.due-past{color:var(--red);font-weight:600} .due-today{color:var(--amber);font-weight:600}
.icon-btn{border:none;background:none;cursor:pointer;color:#9ca3af;font-size:14px;padding:2px 5px;border-radius:5px}
.icon-btn:hover{background:#f3f4f6;color:var(--ink)}
button.primary{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
button.primary:hover{opacity:.88}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:160px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.hint{background:var(--amber-bg);border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
.notif{background:var(--blue-bg);border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.notif.warn{background:var(--red-bg);border-color:#fecaca}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;font-style:italic}
.proj-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.mini{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{font-size:11px;color:var(--muted);text-align:center;padding:2px;font-weight:600}
.cal-c{border:1px solid var(--line);border-radius:8px;min-height:66px;padding:3px;cursor:pointer;background:#fff;overflow:hidden}
.cal-c:hover{border-color:var(--blue)}
.cal-c.off{background:transparent;border:none;cursor:default}
.cal-c.today{border-color:var(--amber);background:var(--amber-bg)}
.cal-c.sel{outline:2px solid var(--blue)}
.cal-c.wknd{background:#fafafa}
.cal-d{font-size:11px;font-weight:600;color:var(--muted)}
.cal-chip{font-size:10px;padding:1px 4px;border-radius:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-red{background:var(--red-bg);color:var(--red)} .c-blue{background:var(--blue-bg);color:var(--blue)} .c-gray{background:#eceff1;color:#546e7a}
.c-green{background:var(--green-bg);color:var(--green)} .c-amber{background:var(--amber-bg);color:var(--amber)}
.wk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wk-col{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;min-height:160px}
.wk-col.today{border-color:var(--amber);background:var(--amber-bg)}
.wk-h{font-size:12px;font-weight:700;text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.wk-item{font-size:12px;padding:3px 6px;border-radius:6px;margin-top:4px;cursor:pointer;line-height:1.35}
.wk-item:hover{outline:1px solid var(--blue)}
.rev-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.day-item{padding:4px 0;font-size:13px}
.idea-body{white-space:pre-wrap;font-size:13px;line-height:1.5;color:var(--ink);margin-top:4px}
.cl-item{display:flex;gap:6px;font-size:12.5px;padding:2px 0;cursor:pointer;align-items:flex-start}
.cl-item:hover{color:var(--blue)}
.cl-item.done{color:var(--muted);text-decoration:line-through}
.ghost{opacity:.55;border:1px dashed currentColor;background:transparent!important}

#mm-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;height:72vh;overflow:auto;position:relative;background-image:radial-gradient(#e5e7eb 1px,transparent 1px);background-size:24px 24px}
#mm-canvas{position:relative;transform-origin:0 0}
#mm-svg{position:absolute;left:0;top:0;pointer-events:none}
.mm-node{position:absolute;max-width:240px;min-width:90px;padding:7px 11px;border:2px solid #94a3b8;border-radius:10px;background:#fff;font-size:13px;line-height:1.35;cursor:grab;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word}
.mm-node.root{font-weight:700;font-size:15px;border-width:3px;background:var(--blue-bg)}
.mm-node.sel{outline:3px solid rgba(37,99,235,.35);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.mm-node:active{cursor:grabbing}
.hstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:6px}
.hb{padding:5px 9px;font-size:12.5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.hb .st{float:right;color:var(--muted);font-size:11px}.hb.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}.hb.min{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.hgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:8px;max-width:440px}
.hcell{aspect-ratio:1;width:100%;border-radius:4px;background:#eceff1;cursor:pointer;display:inline-block}.hcell.ok{background:var(--green)}.hcell.min{background:var(--amber)}.hcell:hover{outline:2px solid var(--blue)}
.tbar{height:6px;border-radius:3px;background:var(--blue-bg);overflow:hidden}.tbar>div{height:100%;background:var(--green)}
textarea{width:100%;resize:vertical;line-height:1.5}
@media(max-width:640px){
  body{padding:8px}h1{font-size:16px}.top{gap:6px}
  .tab{padding:6px 9px;font-size:12px}
  .card{padding:11px}
  .row>input,.row>select,.row>textarea{flex:1 1 100%;width:100%}
  .row>label.mini{flex:1 1 100%}.row>label.mini input,.row>label.mini select{width:100%}
  .task{flex-wrap:wrap}.task>div:last-child{width:100%;display:flex;justify-content:flex-end;gap:2px;padding-left:26px}
  .icon-btn{padding:4px 7px;font-size:15px}
  .t-title{font-size:13.5px}.badge{font-size:10px}
  .sec-title{flex-wrap:wrap;gap:6px}
  .hstrip{grid-template-columns:repeat(2,1fr)}
  .hgrid{max-width:100%}
  #mm-wrap{height:60vh}.wk-grid{grid-template-columns:repeat(1,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .qa-toggle{display:inline-block;flex:0 0 auto!important;width:auto!important}.qa-more{display:none;width:100%;flex-wrap:wrap;gap:8px}.qa-more.open{display:flex}
  #qa-title{flex:1 1 auto!important;width:auto!important}
}
</style>
</head>
<body>
<div class="top">
  <h1>TaskFlow <span class="mini">· Director Economic</span> <span id="prof-box"></span></h1>
  <div class="tabs">
    <div class="tab on" data-tab="azi" onclick="setTab('azi')">Azi</div>
    <div class="tab" data-tab="calendar" onclick="setTab('calendar')">📅 Calendar</div>
    <div class="tab" data-tab="toate" onclick="setTab('toate')">Toate</div>
    <div class="tab" data-tab="proiecte" onclick="setTab('proiecte')">Proiecte</div>
    <div class="tab" data-tab="mindmap" onclick="setTab('mindmap')">🧠 Mindmap</div>
    <div class="tab" data-tab="obiceiuri" onclick="setTab('obiceiuri')" style="display:none">🌱 Obiceiuri</div>
    <div class="tab" data-tab="abonamente" onclick="setTab('abonamente')" style="display:none">💳 Abonamente</div>
    <div class="tab" data-tab="idei" onclick="setTab('idei')">💡 Idei</div>
    <div class="tab" data-tab="rapoarte" onclick="setTab('rapoarte')">Rapoarte</div>
    <div class="tab" data-tab="setari" onclick="setTab('setari')">Setări</div>
  </div>
</div>
<div id="storage-bar"></div>
<div id="notifs"></div>
<div id="view"></div>
<div id="modal-root"></div>

<script>
'use strict';
const KEY='detaskflow_v1';
const TYPE_LABEL={urgent:'Prioritar',normal:'Normal',imbunatatit:'De îmbunătățit',waiting:'În așteptare'};
const RECUR_LABEL={zi:'zilnic',sapt:'săptămânal',luna:'lunar',trim:'trimestrial',sem:'semestrial',an:'anual'};
const COLORS=['#2563eb','#059669','#d97706','#7c3aed','#dc2626','#0891b2','#be185d','#4d7c0f'];

/* ---------- date utils ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function addWorkDays(iso,n){let d=new Date(iso+'T12:00:00'),added=0;while(added<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)added++;}return d.toISOString().slice(0,10);}
function fmt(iso){if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('ro-RO',{day:'numeric',month:'short'});}
function daysDiff(iso){const a=new Date(today()+'T12:00:00'),b=new Date(iso+'T12:00:00');return Math.round((b-a)/86400000);}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return d.toISOString().slice(0,10);}
function nextRecur(iso,r){return r==='zi'?addDays(iso,1):r==='sapt'?addDays(iso,7):r==='luna'?addMonths(iso,1):r==='trim'?addMonths(iso,3):r==='sem'?addMonths(iso,6):addMonths(iso,12);}
/* ocurențele viitoare ale unui task recurent, într-un interval */
function occurrencesIn(tk,from,to){
  const out=[];if(!tk.recur||tk.status!=='active')return out;
  let d=tk.deadline,guard=0;
  while(guard++<500){
    d=nextRecur(d,tk.recur);
    if(tk.until&&d>tk.until)break;
    if(d>to)break;
    if(d>=from)out.push(d);
  }
  return out;
}
function escalated(tk){return tk.type==='normal'&&tk.status==='active'&&daysDiff(tk.deadline)<=2;}

/* ---------- state ---------- */
function seed(){
  const ps=['Echipa economic (operațional)','Situații financiare – Mediu','Situații financiare – Fiscal','Situații financiare – Contabil','Proceduri & înregistrări contabile','Proiecte conexe'];
  return {projects:ps.map((n,i)=>({id:'p'+(i+1),name:n,color:COLORS[i%COLORS.length]})),
    tasks:[],ideas:[],deletedLog:[],dayLog:{},lastOpen:null,nextId:1};
}
let S=null, ROOT=null, VIEWALL=false, fileHandle=null, fileName='', storageStatus='local';
function toRoot(d){
  if(!d)return null;
  if(d.profiles&&d.profiles.length)return d;
  if(d.projects&&d.tasks)return {profiles:[{id:'u1',name:'George',data:d}],active:'u1',savedAt:d.savedAt||null};
  return null;
}
function activeData(){const p=ROOT.profiles.find(x=>x.id===ROOT.active)||ROOT.profiles[0];ROOT.active=p.id;return p.data;}
const FS_OK = typeof window.showSaveFilePicker === 'function';

/* IndexedDB pentru a ține minte fișierul de date între sesiuni */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('taskflow_kv',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch(e){return null;}}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}catch(e){}}

function migrateOne(d){if(!d)return d;(d.projects||[]).forEach(p=>{if(!p.status)p.status='activ';if(p.obj==null)p.obj='';});(d.tasks||[]).forEach(t=>{if(!t.deps)t.deps=[];});if(!d.ideas)d.ideas=[];if(!d.projects)d.projects=seed().projects;if(!d.tasks)d.tasks=[];if(!d.deletedLog)d.deletedLog=[];if(!d.dayLog)d.dayLog={};if(!d.nextId)d.nextId=1;if(!d.cfg)d.cfg={urg:2,norm:0,imb:30,wait:5};if(!d.autoLog)d.autoLog=[];return d;}
function migrate(){if(ROOT&&ROOT.team)delete ROOT.team;migrateOne(S);if(ROOT&&ROOT.profiles)ROOT.profiles.forEach(p=>migrateOne(p.data));}

/* ---------- sincronizare cloud (GitHub Gist) ---------- */
let GH=null,cloudStatus='off',lastCloudStamp=null,cloudTimer=null;
try{GH=JSON.parse(localStorage.getItem('detaskflow_gh'))||null;}catch(e){GH=null;}
async function ghApi(path,method,body){
  const r=await fetch('https://api.github.com'+path,{method:method||'GET',
    headers:{'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('GitHub '+r.status+': '+(await r.text()).slice(0,180));
  return r.json();
}
async function gistText(g){
  const f=g.files&&g.files['taskflow-date.json'];
  if(!f)throw new Error('Fișierul taskflow-date.json lipsește din gist.');
  if(f.truncated){const r=await fetch(f.raw_url);return await r.text();}
  return f.content;
}
async function loadFromCloud(){
  const dr=toRoot(JSON.parse(await gistText(await ghApi('/gists/'+GH.gistId))));
  if(dr){lastCloudStamp=dr.savedAt||null;if(!ROOT||!ROOT.savedAt||(dr.savedAt||'')>=(ROOT.savedAt||''))ROOT=dr;}
  cloudStatus='ok';
}
function writeCloud(){
  if(!GH||!GH.gistId)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{
    try{
      cloudStatus='sync';renderStorageBar();
      try{ /* protecție: alt dispozitiv a scris între timp? */
        const dr=toRoot(JSON.parse(await gistText(await ghApi('/gists/'+GH.gistId))));
        if(dr&&dr.savedAt&&lastCloudStamp&&dr.savedAt>lastCloudStamp){
          if(confirm('⚠️ Datele din cloud au fost modificate de pe alt dispozitiv.\n\nOK = încarcă versiunea din cloud (modificările locale nesalvate se pierd)\nAnulează = suprascrie cloud-ul cu datele de aici')){
            ROOT=dr;S=activeData();migrate();lastCloudStamp=dr.savedAt;
            try{localStorage.setItem(KEY,JSON.stringify(ROOT));}catch(e){}
            cloudStatus='ok';boot(false);return;
          }
        }
      }catch(e){}
      await ghApi('/gists/'+GH.gistId,'PATCH',{files:{'taskflow-date.json':{content:JSON.stringify(ROOT,null,1)}}});
      lastCloudStamp=ROOT.savedAt;cloudStatus='ok';renderStorageBar();
    }catch(e){cloudStatus='error';renderStorageBar();}
  },1200);
}
async function connectGithub(){
  const inp=document.getElementById('gh-token');
  const tok=(inp?inp.value:'').trim();
  if(!tok){alert('Lipește token-ul GitHub (începe de regulă cu ghp_).');return;}
  GH={token:tok,gistId:null};
  try{
    const list=await ghApi('/gists?per_page=100');
    const g=list.find(x=>x.files&&x.files['taskflow-date.json']);
    if(g){
      GH.gistId=g.id;localStorage.setItem('detaskflow_gh',JSON.stringify(GH));
      await loadFromCloud();S=activeData();migrate();save();boot(false);
    }else{
      const created=await ghApi('/gists','POST',{description:'TaskFlow — date (nu șterge)',public:false,files:{'taskflow-date.json':{content:JSON.stringify(ROOT,null,1)}}});
      GH.gistId=created.id;localStorage.setItem('detaskflow_gh',JSON.stringify(GH));
      lastCloudStamp=ROOT.savedAt;cloudStatus='ok';render();
    }
    alert('☁️ Sincronizarea cloud e activă pe acest dispozitiv. Repetă conectarea (același token) pe fiecare dispozitiv.');
  }catch(e){
    GH=null;localStorage.removeItem('detaskflow_gh');cloudStatus='error';render();
    alert('Conectarea a eșuat: '+e.message+'\n\nVerifică: token clasic cu bifă pe scope-ul „gist”, copiat complet.');
  }
}
function disconnectGithub(){
  if(!confirm('Deconectezi sincronizarea cloud pe acest dispozitiv? Datele din cloud rămân neatinse.'))return;
  GH=null;localStorage.removeItem('detaskflow_gh');cloudStatus='off';render();
}

let writeTimer=null,lastFileStamp=null;
function writeFile(){
  if(!fileHandle||storageStatus!=='file')return;
  clearTimeout(writeTimer);
  writeTimer=setTimeout(async()=>{
    try{
      /* protecție multi-PC: verifică dacă alt calculator a modificat fișierul între timp */
      try{
        const f=await fileHandle.getFile();const txt=await f.text();
        if(txt.trim()){
          const dr=toRoot(JSON.parse(txt));
          if(dr&&dr.savedAt&&lastFileStamp&&dr.savedAt>lastFileStamp){
            if(confirm('⚠️ Fișierul de date a fost modificat între timp de pe alt PC.\n\nOK = încarcă versiunea mai nouă din fișier (modificările locale din această sesiune se pierd)\nAnulează = suprascrie fișierul cu datele de aici')){
              ROOT=dr;S=activeData();migrate();lastFileStamp=dr.savedAt;
              try{localStorage.setItem(KEY,JSON.stringify(ROOT));}catch(e){}
              boot(false);return;
            }
          }
        }
      }catch(e){}
      const w=await fileHandle.createWritable();await w.write(JSON.stringify(ROOT,null,1));await w.close();
      lastFileStamp=ROOT.savedAt;
    }
    catch(e){storageStatus='error';renderStorageBar();}
  },400);
}
function save(){
  ROOT.savedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(ROOT));}catch(e){}
  writeFile();
  writeCloud();
}
async function loadFromFile(){
  const f=await fileHandle.getFile();fileName=f.name;
  const txt=await f.text();

/* ---------- expiry engine ---------- */
let bootNotifs=[];
function processExpiries(){
  const t=today();
  const keep=[];
  for(const tk of S.tasks){
    if(tk.status!=='active'||!tk.deadline||tk.deadline>=t){keep.push(tk);continue;}
    if(tk.recur){ // recurring: auto-expire, roll forward
      let missed=0,d=tk.deadline;
      while(d<t){d=nextRecur(d,tk.recur);missed++;}
      if(tk.until&&d>tk.until){
        tk.status='done';tk.doneAt=t;
        bootNotifs.push({txt:'🏁 „'+tk.title+'” — seria recurentă s-a încheiat (până la '+fmt(tk.until)+').'});
        continue;
      }
      tk.missed=(tk.missed||0)+missed;tk.deadline=d;
      (tk.postponements=tk.postponements||[]).push({date:t,auto:true,kind:'recurent'});
      bootNotifs.push({txt:'🔁 „'+tk.title+'” (recurent) a expirat automat și a fost mutat la '+fmt(d)+'.'});
      keep.push(tk);
    } else if(tk.until&&tk.deadline>tk.until){ // a depășit data de expirare
      tk.status='done';tk.doneAt=t;
      bootNotifs.push({txt:'🏁 „'+tk.title+'” a expirat (data limită '+fmt(tk.until)+') și a fost închis.'});
      continue;
    } else if(tk.type==='normal'){ // normal: rolls to current day, no pressure, no delete
      const old=tk.deadline;tk.deadline=t;tk.rolls=(tk.rolls||0)+1;
      (tk.postponements=tk.postponements||[]).push({date:t,auto:true,from:old,to:t,kind:'normal'});
      bootNotifs.push({txt:'🔄 „'+tk.title+'” (normal) a fost reportat pe azi'+(tk.rolls>1?' (a '+tk.rolls+'-a reportare)':'')+'.'});
      keep.push(tk);
    } else if(tk.type==='waiting'){ // waiting on third party: gentle nudge, no limit, no delete
      const old=tk.deadline;tk.deadline=addWorkDays(t,3);
      (tk.postponements=tk.postponements||[]).push({date:t,auto:true,from:old,to:tk.deadline,kind:'asteptare'});
      bootNotifs.push({txt:'⏸ „'+tk.title+'” — încă fără răspuns'+(tk.delegatedTo?' de la '+esc(tk.delegatedTo):'')+'. Trimite un reminder; următoarea verificare: '+fmt(tk.deadline)+'.'});
      keep.push(tk);
    } else if(tk.type==='imbunatatit'){ // prelungire automată conform setărilor
      const old=tk.deadline;tk.deadline=addDays(t,S.cfg.imb);
      (tk.postponements=tk.postponements||[]).push({date:t,auto:true,from:old,to:tk.deadline,kind:'30zile'});
      bootNotifs.push({txt:'📅 „'+tk.title+'” (de îmbunătățit) a primit automat termen nou: '+fmt(tk.deadline)+' (+'+S.cfg.imb+' zile).'});
      keep.push(tk);
    } else { // urgent
      tk.renewCount=(tk.renewCount||0);
      if(tk.renewCount<3){
        tk.renewCount++;const old=tk.deadline;tk.deadline=addWorkDays(t,S.cfg.urg);tk.alert=true;
        (tk.postponements=tk.postponements||[]).push({date:t,auto:true,from:old,to:tk.deadline,kind:'urgent'});
        bootNotifs.push({warn:true,txt:'⚠️ PRIORITAR „'+tk.title+'” neîndeplinit — termen nou '+fmt(tk.deadline)+' (+'+S.cfg.urg+' zile lucrătoare). Amânarea '+tk.renewCount+' din 3.'});
        keep.push(tk);
      } else {
        S.deletedLog.push({title:tk.title,projectId:tk.projectId,createdAt:tk.createdAt,deletedAt:t,postponements:(tk.postponements||[]).length,lastDeadline:tk.deadline});
        bootNotifs.push({warn:true,txt:'🗑️ PRIORITAR „'+tk.title+'” a fost ȘTERS definitiv după 3 amânări. Îl găsești în Rapoarte → Registru ștergeri.'});
      }
    }
  }
  S.tasks=keep;
}

function mergedData(){

    for(const x of pr.data.tasks)m.tasks.push(Object.assign({},x,{id:pr.id+'§'+x.id,projectId:pr.id+'§'+x.projectId,deps:(x.deps||[]).map(d=>pr.id+'§'+d)}));
    for(const i of pr.data.ideas||[])m.ideas.push(Object.assign({},i,{id:pr.id+'§'+i.id}));
    for(const g of pr.data.deletedLog||[])m.deletedLog.push(Object.assign({},g,{projectId:pr.id+'§'+g.projectId}));
    for(const d of Object.keys(pr.data.dayLog||{})){
      if(!m.dayLog[d])m.dayLog[d]={proposed:[],completed:[],order:[]};
      const src=pr.data.dayLog[d];
      (src.proposed||[]).forEach(id=>m.dayLog[d].proposed.push(pr.id+'§'+id));
      (src.completed||[]).forEach(c=>m.dayLog[d].completed.push(Object.assign({},c,{id:pr.id+'§'+c.id,projectId:pr.id+'§'+c.projectId})));
      (src.order||[]).forEach(id=>m.dayLog[d].order.push(pr.id+'§'+id));
    }
  }
  return m;
}

function words(s){return s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,' ').split(/\s+/).filter(w=>w.length>3);}
function similar(a,b){const wa=new Set(words(a)),wb=new Set(words(b));if(!wa.size||!wb.size)return 0;let inter=0;wa.forEach(w=>{if(wb.has(w))inter++;});return inter/Math.min(wa.size,wb.size);}

function sortByPlan(arr){
  const o=azOrder();
  const rk=x=>(x.type==='urgent'||escalated(x))?0:1;
  return arr.slice().sort((a,b)=>{
    const ia=o.indexOf(a.id),ib=o.indexOf(b.id);
    if(ia>=0&&ib>=0)return ia-ib;
    if(ia>=0)return -1;
    if(ib>=0)return 1;
    if(rk(a)!==rk(b))return rk(a)-rk(b);
    return a.deadline<b.deadline?-1:a.deadline>b.deadline?1:0;
  });
}

function ordDrag(ev){ORD_DRAG=ev.currentTarget.getAttribute('data-id');ev.dataTransfer.effectAllowed='move';}
function ordDrop(ev,targetId){ev.preventDefault();const from=ORD_DRAG;ORD_DRAG=null;if(!from||from===targetId)return;M(()=>{
  const ids=azToday().map(x=>x.id);const i=ids.indexOf(from),j=ids.indexOf(targetId);if(i<0||j<0)return;
  ids.splice(i,1);ids.splice(j,0,from);setOrder(ids);save();orderPopup();});}
function ordSet(id,pos){M(()=>{const ids=azToday().map(x=>x.id);const i=ids.indexOf(id);if(i<0)return;ids.splice(i,1);ids.splice(+pos,0,id);setOrder(ids);save();orderPopup();});}
function moveTask(id,dir){M(()=>{
  const list=azToday();
  const i=list.findIndex(x=>x.id===id);const j=i+dir;
  if(i<0||j<0||j>=list.length)return;
  const ids=list.map(x=>x.id);ids.splice(i,1);ids.splice(j,0,id);
  setOrder(ids);
  save();render();
});}

/* ---------- rendering helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dueLabel(tk){
  const d=daysDiff(tk.deadline);
  let cls='',txt=fmt(tk.deadline);
  if(d<0){cls='due-past';txt+=' · depășit';}
  else if(d===0){cls='due-today';txt+=' · azi';}
  else if(d<=2){cls='due-today';txt+=' · '+d+' zile';}
  return '<span class="'+cls+'">⏱ '+txt+'</span>';
}
function taskRow(tk,opts){
  opts=opts||{};
  const p=proj(tk.projectId);
  let badges='';
  if(tk.type==='urgent')badges+='<span class="badge b-red">Prioritar'+(tk.renewCount?' · amânat '+tk.renewCount+'/3':'')+'</span>';
  else if(tk.type==='waiting')badges+='<span class="badge b-gray">⏸ Așteaptă răspuns</span>';
  else if(escalated(tk))badges+='<span class="badge b-red">Prioritar · termen aproape</span>';
  else if(tk.type==='normal')badges+='<span class="badge b-green">Normal'+(tk.manualDue?'':' · azi')+(tk.rolls?' · reportat '+tk.rolls+'x':'')+'</span>';
  else badges+='<span class="badge b-blue">De îmbunătățit</span>';
  if(tk.recur)badges+='<span class="badge b-gray">🔁 '+RECUR_LABEL[tk.recur]+(tk.until?' până '+fmt(tk.until):'')+'</span>';
  else if(tk.until)badges+='<span class="badge b-gray">expiră '+fmt(tk.until)+'</span>';
  if(tk.delegatedTo)badges+='<span class="badge b-amber">👤 '+esc(tk.delegatedTo)+'</span>';
  const pinnedNow=dl(today()).proposed.includes(tk.id);
  if(pinnedNow)badges+='<span class="badge b-amber">📌 azi</span>';
  const odp=openDeps(tk);if(odp.length)badges+='<span class="badge b-amber" title="'+esc(odp.map(o=>o.title).join(' · '))+'">⛓ așteaptă '+odp.length+'</span>';
  const unl=unlocks(tk.id);if(unl.length)badges+='<span class="badge b-blue" title="'+esc(unl.map(o=>o.title).join(' · '))+'">🔓 deblochează '+unl.length+'</span>';
  let clHtml='';
  if(tk.checklist&&tk.checklist.length){
    const cd=tk.checklist.filter(c=>c.done).length;
    badges+='<span class="badge b-gray">☑ '+cd+'/'+tk.checklist.length+'</span>';
    clHtml='<div style="margin-top:5px">'+tk.checklist.map((c,ix)=>'<div class="cl-item'+(c.done?' done':'')+'" onclick="toggleCheck(\''+tk.id+'\','+ix+')">'+(c.done?'☑':'☐')+' <span>'+esc(c.txt)+'</span></div>').join('')+'</div>';
  }
  return '<div class="task'+(tk.alert?' alerted':'')+'" data-id="'+tk.id+'">'
    +'<div class="chk" title="Finalizează" onclick="completeTask(\''+tk.id+'\')"></div>'
    +'<div class="t-body"><div class="t-title" title="Click pentru editare rapidă" onclick="inlineEdit(event,\''+tk.id+'\')" style="cursor:text">'+esc(tk.title)+'</div>'
    +'<div class="t-meta"><span><span class="proj-dot" style="background:'+p.color+'"></span>'+esc(p.name)+'</span>'
    +dueLabel(tk)+badges+'</div>'+clHtml+'</div>'
    +('<div>'
    +(opts.reorder?'<button class="icon-btn" title="Mai sus" onclick="moveTask(\''+tk.id+'\',-1)">▲</button><button class="icon-btn" title="Mai jos" onclick="moveTask(\''+tk.id+'\',1)">▼</button>':'')
    +'<button class="icon-btn" title="Editează" onclick="editTask(\''+tk.id+'\')">✏️</button>'
    +'<button class="icon-btn" title="'+(pinnedNow?'Scoate din lista de azi':'Alege pentru azi')+'" onclick="togglePropose(\''+tk.id+'\')">'+(pinnedNow?'📍':'📌')+'</button>'
    +'<button class="icon-btn" title="Schimbă termenul" onclick="editDeadline(\''+tk.id+'\')">📅</button>'
    +'<button class="icon-btn" title="Șterge" onclick="deleteTask(\''+tk.id+'\')">✕</button>'
    +'</div>')+'</div>';
}
function section(title,badgeCls,tasks,emptyTxt,opts){
  return '<div class="card"><div class="sec-title"><h2>'+title+'</h2><span class="badge '+badgeCls+'">'+tasks.length+'</span></div>'
    +(tasks.length?tasks.map(t=>taskRow(t,opts)).join(''):'<div class="empty">'+emptyTxt+'</div>')+'</div>';

function depChips(tk){
  return (tk.deps||[]).map(d=>{const o=S.tasks.find(x=>x.id===d);if(!o)return '';
    return '<span class="badge '+(o.status==='active'?'b-amber':'b-green')+'" style="margin:2px 4px 2px 0">'+esc(o.title)+(o.status==='active'?'':' ✓')
      +' <a href="#" onclick="depRemove(\''+aid(tk.id)+'\',\''+d+'\');return false" style="text-decoration:none;color:inherit">✕</a></span>';}).join('')||'<span class="mini">—</span>';
}
function depAdd(id){
  const tk=S.tasks.find(x=>x.id===id);const inp=document.getElementById('e-dep-add');const v=(inp.value||'').trim().toLowerCase();if(!tk||!v)return;
  const o=S.tasks.find(x=>x.status==='active'&&x.id!==id&&x.title.toLowerCase()===v)||S.tasks.find(x=>x.status==='active'&&x.id!==id&&x.title.toLowerCase().includes(v));
  if(!o){alert('Nu am găsit un task activ cu acest titlu.');return;}
  if((o.deps||[]).includes(id)){alert('Dependență circulară: „'+o.title+'” depinde deja de acest task.');return;}
  tk.deps=tk.deps||[];if(!tk.deps.includes(o.id))tk.deps.push(o.id);
  inp.value='';document.getElementById('e-deps').innerHTML=depChips(tk);save();
}
function depRemove(id,d){const tk=S.tasks.find(x=>x.id===id);if(!tk)return;tk.deps=(tk.deps||[]).filter(x=>x!==d);document.getElementById('e-deps').innerHTML=depChips(tk);save();}
function openDeps(tk){return (tk.deps||[]).map(d=>S.tasks.find(x=>x.id===d)).filter(o=>o&&o.status==='active');}
function unlocks(id){return S.tasks.filter(x=>x.status==='active'&&(x.deps||[]).includes(id));}
function saveEdit(id){
  const tk=S.tasks.find(x=>x.id===id);if(!tk)return;
  const title=document.getElementById('e-title').value.trim();
  if(title)tk.title=title;
  tk.projectId=document.getElementById('e-proj').value;
  const newType=document.getElementById('e-type').value;
  if(newType!==tk.type){tk.type=newType;tk.renewCount=0;tk.alert=false;}
  tk.recur=document.getElementById('e-recur').value||null;
  tk.delegatedTo=document.getElementById('e-deleg').value.trim()||null;
  const d=document.getElementById('e-dead').value;
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&d!==tk.deadline){
    (tk.postponements=tk.postponements||[]).push({date:today(),auto:false,from:tk.deadline,to:d,kind:'manual'});
    tk.deadline=d;tk.alert=false;if(tk.type==='normal')tk.manualDue=true;
  }
  const u=document.getElementById('e-until').value;tk.until=/^\d{4}-\d{2}-\d{2}$/.test(u)?u:null;
  const clLines=document.getElementById('e-cl').value.split('\n').map(s=>s.replace(/^[\s•*\-]+/,'').trim()).filter(Boolean);
  if(clLines.length){
    const old=tk.checklist||[];
    tk.checklist=clLines.map(x=>{const o=old.find(c=>c.txt===x);return {txt:x,done:o?o.done:false};});
  } else tk.checklist=null;
  save();closeEdit();
}

let CAL=null,CAL_SEL=today();
function calInit(){if(!CAL){const t=today();CAL={y:+t.slice(0,4),m:+t.slice(5,7)-1};}}
function calShift(n){CAL.m+=n;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}render();}
function calToday(){CAL=null;CAL_SEL=today();render();}
function setCalDay(d){CAL_SEL=d;render();}
let CALMODE='luna',WK_OFF=0,DRAG=null;
function dragTask(ev,id){DRAG=id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',id);}catch(e){}}
function dropTask(ev,iso){
  ev.preventDefault();ev.stopPropagation();
  const id=DRAG||(ev.dataTransfer?ev.dataTransfer.getData('text/plain'):null);DRAG=null;
  dropApply(id,iso);
}
function dropApply(id,iso){
  const tk=S.tasks.find(x=>x.id===id);if(!tk)return;
  if(iso<today()){alert('Nu poți muta un task pe o zi din trecut.');return;}
  if(iso===tk.deadline)return;
  (tk.postponements=tk.postponements||[]).push({date:today(),auto:false,from:tk.deadline,to:iso,kind:'manual'});
  tk.deadline=iso;tk.alert=false;
  if(tk.type==='urgent')tk.renewCount=0;
  if(tk.type==='normal')tk.manualDue=true;
  save();render();
}
function setCalMode(m){CALMODE=m;render();}
function weekShift(n){WK_OFF+=n;render();}
function weekStart(off){const d=new Date(today()+'T12:00:00');const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+off*7);return d.toISOString().slice(0,10);}
function viewWeek(){
  const start=weekStart(WK_OFF),t=today();
  const days=[];for(let i=0;i<5;i++)days.push(addDays(start,i));
  const byDate={};S.tasks.filter(x=>x.status==='active').forEach(x=>{(byDate[x.deadline]=byDate[x.deadline]||[]).push(x);});
  const doneBy={};Object.keys(S.dayLog).forEach(d=>{(S.dayLog[d].completed||[]).forEach(c=>{(doneBy[d]=doneBy[d]||[]).push(c);});});
  const ghostBy={};
  S.tasks.filter(x=>x.status==='active'&&x.recur).forEach(x=>{
    occurrencesIn(x,days[0],addDays(start,6)).forEach(d=>{(ghostBy[d]=ghostBy[d]||[]).push(x);});
  });
  const names=['Luni','Marți','Miercuri','Joi','Vineri'];
  let h='<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">'
    +'<button class="ghost" onclick="weekShift(-1)">← săpt. prec.</button>'
    +'<h2>Săptămâna '+fmt(days[0])+' – '+fmt(days[4])+'</h2>'
    +'<span><button class="ghost" onclick="WK_OFF=0;render()">Azi</button> <button class="ghost" onclick="weekShift(1)">săpt. urm. →</button> <button class="ghost" onclick="setCalMode(\'luna\')">📅 Lună</button></span></div>';
  h+='<div class="wk-grid">';
  for(let i=0;i<5;i++){
    const iso=days[i];const ts=(byDate[iso]||[]);const ds=(doneBy[iso]||[]);
    h+='<div class="wk-col'+(iso===t?' today':'')+'" ondragover="event.preventDefault()" ondrop="dropTask(event,\''+iso+'\')"><div class="wk-h">'+names[i]+'<br><span class="mini">'+fmt(iso)+'</span></div>'
      +ts.map(x=>'<div class="wk-item '+((x.type==='urgent'||escalated(x))?'c-red':x.type==='waiting'?'c-gray':x.type==='normal'?'c-amber':'c-blue')+'"'+(' draggable="true" ondragstart="dragTask(event,\''+x.id+'\')" style="cursor:grab" title="Click = editare · Trage = mută scadența" onclick="editTask(\''+x.id+'\')"')+'>'+esc(x.title)+'</div>').join('')
      +ds.map(c=>'<div class="wk-item c-green">✓ '+esc(c.title)+'</div>').join('')
      +habitDoneList(iso).map(h=>'<div class="wk-item c-green">🌱 '+esc(h.name)+(h.val!=null?' '+h.val+(h.unit||''):'')+'</div>').join('')
      +(ghostBy[iso]||[]).map(x=>'<div class="wk-item c-blue ghost" title="Repetare programată — '+RECUR_LABEL[x.recur]+'">🔁 '+esc(x.title)+'</div>').join('')
      +((!ts.length&&!ds.length&&!(ghostBy[iso]||[]).length)?'<div class="mini" style="text-align:center;padding-top:12px">—</div>':'')
      +'</div>';
  }
  h+='</div><p class="mini" style="margin-top:8px">Click pe un task → editare (poți muta scadența pentru a echilibra săptămâna). Verde = finalizat.</p></div>';
  return h;
}
function viewCalendar(){
  if(CALMODE==='sapt')return viewWeek();
  calInit();

  S.tasks.filter(x=>x.status==='active').forEach(x=>{(byDate[x.deadline]=byDate[x.deadline]||[]).push(x);});

    const ts=(byDate[iso]||[]),ds=(doneBy[iso]||[]);
    const chips=ts.map(x=>({t:x.title,c:(x.type==='urgent'||escalated(x))?'c-red':x.type==='waiting'?'c-gray':x.type==='normal'?'c-amber':'c-blue',pre:'',id:x.id}))
      .concat(ds.map(x=>({t:x.title,c:'c-green',pre:'✓ '})))
      .concat((ghostBy[iso]||[]).map(x=>({t:x.title,c:'c-blue ghost',pre:'🔁 '})))
      .concat(habitDoneList(iso).map(h=>({t:h.name+(h.val!=null?' '+h.val+(h.unit||''):''),c:'c-green',pre:'🌱 '})));
    const CAP=8;
    h+='<div class="cal-c'+(iso===t?' today':'')+(iso===CAL_SEL?' sel':'')+((wd===0||wd===6)?' wknd':'')+'" onclick="setCalDay(\''+iso+'\')" ondragover="event.preventDefault()" ondrop="dropTask(event,\''+iso+'\')">'
      +'<div class="cal-d">'+d+(chips.length?' · '+chips.length:'')+'</div>'
      +chips.slice(0,CAP).map(x=>'<div class="cal-chip '+x.c+'"'+((x.id)?' draggable="true" ondragstart="dragTask(event,\''+x.id+'\')" style="cursor:grab"':'')+' title="'+esc(x.pre+x.t)+'">'+x.pre+esc(x.t)+'</div>').join('')
      +(chips.length>CAP?'<div class="mini">+'+(chips.length-CAP)+' încă</div>':'')
      +'</div>';
  }
  h+='</div><p class="mini" style="margin-top:8px"><span class="cal-chip c-red" style="display:inline">Prioritar</span> <span class="cal-chip c-amber" style="display:inline">Normal</span> <span class="cal-chip c-blue" style="display:inline">De îmbunătățit</span> <span class="cal-chip c-gray" style="display:inline">În așteptare</span> <span class="cal-chip c-green" style="display:inline">✓ Finalizat</span> <span class="cal-chip c-blue ghost" style="display:inline">🔁 Repetare viitoare</span> — termene, istoric și proiecția recurentelor.</p></div>';
  const sel=(byDate[CAL_SEL]||[]).sort((a,b)=>a.type==='urgent'?-1:1);
  const selDone=doneBy[CAL_SEL]||[];
  const selGhost=ghostBy[CAL_SEL]||[];
  h+='<div class="card"><div class="sec-title"><h2>📅 '+fmt(CAL_SEL)+'</h2><span class="badge b-gray">'+(sel.length+selDone.length)+'</span></div>'
    +(sel.length?sel.map(x=>taskRow(x)).join(''):'')
    +(selDone.length?'<div style="margin-top:8px"><span class="badge b-green">Finalizate în această zi: '+selDone.length+'</span>'
      +selDone.map(c=>'<div class="day-item" style="color:var(--green)">✓ '+esc(c.title)+' <span class="mini">· '+esc(proj(c.projectId).name)+'</span></div>').join('')+'</div>':'')
    +habitDayDetail(CAL_SEL)
    +(selGhost.length?'<div style="margin-top:8px"><span class="badge b-gray">🔁 Repetări programate: '+selGhost.length+'</span>'
      +selGhost.map(x=>'<div class="day-item" style="opacity:.7">🔁 '+esc(x.title)+' <span class="mini">· '+esc(proj(x.projectId).name)+' · '+RECUR_LABEL[x.recur]+'</span></div>').join('')+'</div>':'')
    +((!sel.length&&!selDone.length&&!selGhost.length)?'<div class="empty">Nimic în această zi.</div>':'')
    +((CAL_SEL<=t)?'<div class="row" style="margin-top:10px"><input class="grow" id="rc-title" placeholder="Am mai făcut în această zi… (Enter)" onkeydown="if(event.key===\'Enter\')addRetro()">'
      +'<select id="rc-proj">'+projOpen().map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select>'
      +'<button class="ghost" onclick="addRetro()">✓ Adaugă ca finalizat</button></div>':'')
    +'</div>';
  return h;
}

/* ---------- mindmap: pune-ți gândurile în ordine ---------- */
let MM_SEL=null,MM_NODE=null,MM_DRAG=null,MM_ZOOM=1,MM_BOUND=false;
const MM_COLORS=['#2563eb','#059669','#d97706','#7c3aed','#dc2626','#0891b2','#6b7280'];
function mmMaps(){if(!S.maps)S.maps=[];return S.maps;}
function mmCur(){const m=mmMaps();let c=m.find(x=>x.id===(MM_SEL||S.mapSel));if(!c&&m.length)c=m[0];if(c){MM_SEL=c.id;S.mapSel=c.id;}return c||null;}
function mmNew(name,rootText){
  const id='m'+Date.now();const map={id,name:name||'Hartă nouă',createdAt:today(),nodes:[{id:'n1',t:rootText||name||'Ideea centrală',x:60,y:300,p:null,c:MM_COLORS[0]}],seq:1};
  mmMaps().push(map);MM_SEL=id;S.mapSel=id;MM_NODE='n1';return map;
}
function mmNid(map){map.seq=(map.seq||map.nodes.length)+1;return 'n'+map.seq;}
function mmChildren(map,pid){return map.nodes.filter(n=>n.p===pid);}
function mmAdd(map,pid,text,extra){
  const par=map.nodes.find(n=>n.id===pid);const sib=mmChildren(map,pid).length;
  const n=Object.assign({id:mmNid(map),t:text||'',p:pid,x:par?par.x+250:60,y:par?par.y+sib*64:60,c:par?par.c:MM_COLORS[0]},extra||{});
  map.nodes.push(n);return n;
}
function mmDelete(map,id){
  const kill=new Set([id]);let grew=true;
  while(grew){grew=false;map.nodes.forEach(n=>{if(n.p&&kill.has(n.p)&&!kill.has(n.id)){kill.add(n.id);grew=true;}});}
  map.nodes=map.nodes.filter(n=>!kill.has(n.id));
}
function mmLayout(map){
  const kids=id=>mmChildren(map,id);
  const leaves=id=>{const k=kids(id);return k.length?k.reduce((s,c)=>s+leaves(c.id),0):1;};
  let y=40;const X=260,Y=64;
  function place(n,depth){const k=kids(n.id);n.x=40+depth*X;
    if(!k.length){n.y=y;y+=Y;return;}
    const y0=y;k.forEach(c=>place(c,depth+1));n.y=Math.round((y0+(y-Y))/2);}
  const root=map.nodes.find(n=>!n.p);if(root)place(root,0);
}
function mmSeedProject(pid){
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const map=mmNew(p.name,p.name);map.nodes[0].c=p.color;
  S.tasks.filter(t=>t.projectId===pid&&t.status==='active').sort((a,b)=>a.deadline<b.deadline?-1:1).forEach(t=>{
    const n=mmAdd(map,'n1',t.title,{task:t.id});
    (t.checklist||[]).forEach(c=>mmAdd(map,n.id,(c.done?'✓ ':'')+c.txt));
  });
  mmLayout(map);save();render();
}
function mmSeedIdeas(){

    ideaBody(i).split('\n').map(l=>l.replace(/^[\s•*\-]+/,'').trim()).filter(Boolean).forEach(l=>mmAdd(map,n.id,l));});
  mmLayout(map);save();render();
}

function mmToIdea(id){const m=mmCur();const n=m.nodes.find(x=>x.id===id);if(!n)return;const txt=(document.getElementById('mm-txt').value||n.t).trim();if(!txt){alert('Scrie întâi textul.');return;}
  const kids=mmChildren(m,n.id).map(c=>c.t.trim()).filter(Boolean);
  const idea={id:'i'+Date.now(),text:txt+(kids.length?'\n'+kids.map(k=>'- '+k).join('\n'):''),createdAt:today()};S.ideas.push(idea);n.t=txt;n.idea=idea.id;save();mmCloseEdit();alert('💡 Salvată în Idei.');}
function mmToProject(id){const m=mmCur();const n=m.nodes.find(x=>x.id===id);if(!n)return;const txt=(document.getElementById('mm-txt').value||n.t).trim();if(!txt){alert('Scrie întâi textul.');return;}
  if(S.projects.some(p=>p.name.toLowerCase()===txt.toLowerCase())){alert('Există deja un proiect cu acest nume.');return;}
  S.projects.push({id:'p'+Date.now(),name:txt,color:n.c||COLORS[S.projects.length%COLORS.length],status:'activ',obj:''});n.t=txt;save();mmCloseEdit();alert('📁 Proiect creat: '+txt);}
function mmDown(ev,id){if(ev.button!==0)return;ev.preventDefault();const m=mmCur();const n=m&&m.nodes.find(x=>x.id===id);if(!n)return;
  MM_DRAG={id,sx:ev.clientX,sy:ev.clientY,ox:n.x,oy:n.y,moved:false};mmSelect(id);}
function mmBind(){
  if(MM_BOUND)return;MM_BOUND=true;
  document.addEventListener('mousemove',ev=>{if(!MM_DRAG)return;const m=mmCur();const n=m&&m.nodes.find(x=>x.id===MM_DRAG.id);if(!n)return;
    const dx=(ev.clientX-MM_DRAG.sx)/MM_ZOOM,dy=(ev.clientY-MM_DRAG.sy)/MM_ZOOM;if(Math.abs(dx)+Math.abs(dy)>3)MM_DRAG.moved=true;
    n.x=Math.max(0,Math.round(MM_DRAG.ox+dx));n.y=Math.max(0,Math.round(MM_DRAG.oy+dy));
    const el=document.querySelector('.mm-node[data-id="'+n.id+'"]');if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}mmDrawEdges();});
  document.addEventListener('mouseup',()=>{if(!MM_DRAG)return;const moved=MM_DRAG.moved;MM_DRAG=null;if(moved)save();});
  document.addEventListener('keydown',ev=>{
    if(TAB!=='mindmap'||VIEWALL)return;const tg=(ev.target&&ev.target.tagName||'').toLowerCase();
    if(tg==='input'||tg==='textarea'||tg==='select'||document.getElementById('modal-root').innerHTML)return;
    if(!MM_NODE)return;
    if(ev.key==='Tab'){ev.preventDefault();mmAddChild();}
    else if(ev.key==='Enter'){ev.preventDefault();mmAddSibling();}
    else if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();mmDelNode();}
    else if(ev.key==='F2'||ev.key===' '){ev.preventDefault();mmEditNode(MM_NODE);}
    else if(ev.key==='Escape'){mmSelect(null);}
  });
}
function mmDrawEdges(){
  const m=mmCur();const svg=document.getElementById('mm-svg');if(!m||!svg)return;let d='';
  m.nodes.forEach(n=>{if(!n.p)return;const a=document.querySelector('.mm-node[data-id="'+n.p+'"]'),b=document.querySelector('.mm-node[data-id="'+n.id+'"]');if(!a||!b)return;

    d+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+','+mx+' '+y2+','+x2+' '+y2+'" stroke="'+(n.c||'#94a3b8')+'" stroke-width="2" fill="none" opacity=".7"/>';});

}

  return h;

/* ---------- module: obiceiuri & abonamente (profil „Personal”) ---------- */
function modsOn(k){return !!(S&&S.mods&&S.mods[k]);}
function setMod(k,v){S.mods=S.mods||{};S.mods[k]=v?1:0;save();render();}
/* --- obiceiuri --- */
function habitLog(d){S.habitLog=S.habitLog||{};return S.habitLog[d]=S.habitLog[d]||{};}
function habitEntry(h,d){const L=S.habitLog||{};return L[d]&&L[d][h.id];}
function habitStreak(h){let n=0,d=today();const e0=habitEntry(h,d);if(!(e0&&e0.ok))d=addDays(d,-1);let e=habitEntry(h,d);while(e&&e.ok){n++;d=addDays(d,-1);e=habitEntry(h,d);}return n;}
function habitBest(h){const days=Object.keys(S.habitLog||{}).filter(d=>(S.habitLog[d][h.id]||{}).ok).sort();let best=0,run=0,prev=null;
  days.forEach(d=>{run=(prev&&addDays(prev,1)===d)?run+1:1;if(run>best)best=run;prev=d;});return best;}
function habitRate(h,n){let ok=0;for(let i=0;i<n;i++){const e=habitEntry(h,addDays(today(),-i));if(e&&e.ok)ok++;}return Math.round(100*ok/n);}
function habitMark(id,d){
  const h=S.habits.find(x=>x.id===id);if(!h)return;const L=habitLog(d);const e=L[id];
  if(e){if(e.ok&&h.target==null){delete L[id];save();render();return;}
    if(!confirm((e.ok?'Scoți bifa':'Refaci bifa')+' la „'+h.name+'” ('+fmt(d)+')?'))return;
    if(e.ok){delete L[id];save();render();return;}}
  let val=null,ok=true,lvl='complet';
  if(h.target!=null){const v=prompt(h.name+' — valoare pentru '+fmt(d)+' (țintă '+h.target+(h.unit||'')+'):',h.target);if(v===null)return;val=parseFloat(String(v).replace(',','.'));if(isNaN(val))return;ok=val>=h.target;lvl=ok?'complet':'minim';}
  L[id]={lvl,val,ok};save();render();
}
function habitTick(id){habitMark(id,today());}
function habitDoneList(d){
  if(!modsOn('habits')||!(S.habits||[]).length)return [];const L=(S.habitLog||{})[d];if(!L)return [];
  return S.habits.filter(h=>!h.archived&&L[h.id]&&L[h.id].ok).map(h=>({name:h.name,val:L[h.id].val,unit:h.unit}));
}
function habitDaySummary(d){
  if(!modsOn('habits')||!(S.habits||[]).length)return null;const L=(S.habitLog||{})[d];if(!L)return null;
  const hs=S.habits.filter(h=>!h.archived);const ok=hs.filter(h=>L[h.id]&&L[h.id].ok);if(!ok.length&&!hs.some(h=>L[h.id]))return null;
  return {ok:ok.length,total:hs.length,txt:ok.length+'/'+hs.length+' obiceiuri',names:ok.map(h=>h.name).join(' · ')};
}
function habitDayDetail(d){
  if(!modsOn('habits')||!(S.habits||[]).length)return '';const L=(S.habitLog||{})[d]||{};const hs=S.habits.filter(h=>!h.archived);
  const items=hs.map(h=>{const e=L[h.id];return '<span class="badge '+(e?(e.ok?'b-green':'b-amber'):'b-gray')+'" style="margin:2px 4px 2px 0;cursor:pointer" onclick="habitMark(\''+h.id+'\',\''+d+'\')">'+(e?(e.ok?'✓ ':'◐ '):'○ ')+esc(h.name)+(e&&e.val!=null?' '+e.val+(h.unit||''):'')+'</span>';}).join('');
  const ok=hs.filter(h=>L[h.id]&&L[h.id].ok).length;
  return '<div style="margin-top:8px"><span class="badge b-green">🌱 Obiceiuri '+ok+'/'+hs.length+'</span><div style="margin-top:4px">'+items+'</div></div>';
}
function habitStrip(){
  if(VIEWALL||!modsOn('habits')||!(S.habits||[]).length)return '';

const SUB_RECUR={lunar:'lunar','30zile':'la 30 de zile',anual:'anual','2ani':'la 2 ani',unic:'plată unică'};
function subNext(d,r){return r==='lunar'?addMonths(d,1):r==='30zile'?addDays(d,30):r==='anual'?addMonths(d,12):r==='2ani'?addMonths(d,24):null;}
function subMonthly(s){const v=s.ron||0;return s.recur==='lunar'?v:s.recur==='30zile'?v*365/30/12:s.recur==='anual'?v/12:s.recur==='2ani'?v/24:0;}
function subWindow(s){return Math.max(7,s.notice||0);}
function subsProcess(){ /* cele cu reînnoire automată trec singure la perioada următoare */
  (S.subs||[]).forEach(s=>{if(!s.auto||!s.due||s.recur==='unic')return;let g=0;
    while(s.due<today()&&g++<60){(s.history=s.history||[]).push({d:s.due,price:s.price,cur:s.cur,ron:s.ron,note:'reînnoire automată'});const nx=subNext(s.due,s.recur);if(!nx)break;s.due=nx;
      S.autoLog=(S.autoLog||[]).concat([{d:today(),t:'💳 „'+s.name+'” s-a reînnoit automat; următoarea scadență: '+fmt(s.due)+'.'}]);}});
}
function subDueRows(){
  if(VIEWALL||!modsOn('subs')||!(S.subs||[]).length)return '';
  const man=[],auto=[];
  (S.subs||[]).forEach(s=>{if(!s.due)return;const d=daysDiff(s.due);if(d>subWindow(s))return;(s.auto?auto:man).push({d,s});});
  man.sort((a,b)=>a.d-b.d);auto.sort((a,b)=>a.d-b.d);
  let h=man.map(({s,d})=>'<div class="task" style="background:#fffbeb;border-radius:8px;margin:2px 0;padding:8px"><div class="chk" title="Plătit / reînnoit" onclick="subPay(\''+s.id+'\')"></div>'
    +'<div class="t-body"><div class="t-title">* 💳 '+esc(s.name)+' <span class="mini">'+(s.ron||0).toLocaleString('ro-RO')+' lei'+(s.cur!=='RON'?' ('+s.price+' '+s.cur+')':'')+'</span></div>'
    +'<div class="t-meta"><span class="'+(d<0?'due-past':'due-today')+'">⏱ '+fmt(s.due)+(d<0?' · depășit cu '+(-d)+' zile':d===0?' · azi':' · în '+d+' zile')+'</span><span class="badge b-gray">'+esc(s.cat||'')+'</span>'+(s.note?'<span class="mini">'+esc(s.note)+'</span>':'')+'</div></div>'
    +'<div><button class="icon-btn" title="Detalii" onclick="setTab(\'abonamente\')">💳</button></div></div>').join('');
  if(auto.length)h+='<div class="mini" style="padding:6px 8px;color:var(--muted)">🔁 Se reînnoiesc automat: '+auto.map(({s,d})=>esc(s.name)+' ('+fmt(s.due)+', '+(s.ron||0)+' lei)').join(' · ')+' — nu ai nimic de făcut.</div>';
  return h;
}

function weekDates(){const r=[];for(let i=6;i>=0;i--)r.push(addDays(today(),-i));return r;}
function viewRapoarte(){
  const t=today();
  const propIds=dl(t).proposed, comp=dl(t).completed;
  const doneOfProposed=comp.filter(c=>propIds.includes(c.id)).length;
  const pct=propIds.length?Math.round(100*doneOfProposed/propIds.length):0;
  // daily
  let h='<div class="card"><h2>📋 Rezumat zilnic — '+fmt(t)+'</h2>'
    +'<p style="margin:6px 0">Propuse: <b>'+propIds.length+'</b> · Finalizate (total): <b>'+comp.length+'</b> · Realizare din propuse: <b>'+pct+'%</b></p>'
    +(comp.length?comp.map(c=>'<div class="day-item">✓ '+esc(c.title)+'</div>').join(''):'<div class="empty">Nimic finalizat încă azi.</div>')
    +'<div style="margin-top:10px"><button class="ghost" onclick="copyReport()">📋 Copiază raportul (pt. email)</button> '+(VIEWALL?'':'<button class="ghost" onclick="startReviewManual()">🧹 Pornește revizuirea săptămânală</button> ')+'<span id="copy-ok" class="mini"></span></div></div>';
  const alog=(S.autoLog||[]).slice().reverse();
  h+='<div class="card"><details><summary>🔄 Jurnal modificări automate ('+alog.length+')</summary>'
    +'<p class="mini" style="margin:6px 0">Ce a reprogramat sistemul singur (recurente, reportări, prelungiri, ștergeri după 3 amânări). Nu te mai întrerupe pe ecranul „Azi" — îl consulți doar când vrei.</p>'
    +(alog.length?alog.slice(0,60).map(x=>'<div class="day-item mini">'+fmt(x.d)+' — '+x.t+'</div>').join(''):'<div class="empty">Nimic deocamdată.</div>')
    +'</details></div>';
  // weekly per project
  const wk=weekDates();
  h+='<div class="card"><h2>📊 Săptămâna (ultimele 7 zile) — pe proiecte</h2><table><tr><th>Proiect</th><th>Finalizate</th><th>Active</th><th>Depășite</th><th>Amânări</th><th>Șterse</th></tr>';
  for(const p of S.projects){
    let done=0;wk.forEach(d=>{(S.dayLog[d]?.completed||[]).forEach(c=>{if(c.projectId===p.id)done++;});});
    const act=S.tasks.filter(x=>x.projectId===p.id&&x.status==='active');
    const over=act.filter(x=>x.deadline<t).length;
    let post=0;S.tasks.forEach(x=>{if(x.projectId===p.id)(x.postponements||[]).forEach(pp=>{if(wk.includes(pp.date))post++;});});
    const del=S.deletedLog.filter(x=>x.projectId===p.id&&wk.includes(x.deletedAt)).length;
    h+='<tr><td><span class="proj-dot" style="background:'+p.color+'"></span>'+esc(p.name)+'</td><td>'+done+'</td><td>'+act.length+'</td><td>'+(over?'<b style="color:var(--red)">'+over+'</b>':'0')+'</td><td>'+post+'</td><td>'+(del?'<b style="color:var(--red)">'+del+'</b>':'0')+'</td></tr>';
  }
  h+='</table></div>';
  // postponement stats
  const stats={};
  S.tasks.concat().forEach(x=>{const n=(x.postponements||[]).length;if(n){const k=proj(x.projectId).name;stats[k]=(stats[k]||0)+n;}});
  h+='<div class="card"><h2>⏳ Statistici amânări (total, taskuri active)</h2>';
  const ks=Object.keys(stats).sort((a,b)=>stats[b]-stats[a]);
  h+=ks.length?('<table><tr><th>Proiect</th><th>Amânări</th></tr>'+ks.map(k=>'<tr><td>'+esc(k)+'</td><td>'+stats[k]+'</td></tr>').join('')+'</table><p class="mini" style="margin-top:8px">Unde se adună amânările, acolo e blocajul real.</p>'):'<div class="empty">Nicio amânare înregistrată. Excelent.</div>';
  h+='</div>';
  // deleted register
  h+='<div class="card"><h2>🗑️ Registru taskuri șterse (prioritare, după 3 amânări)</h2>';
  h+=S.deletedLog.length?('<table><tr><th>Task</th><th>Proiect</th><th>Creat</th><th>Șters</th><th>Amânări</th></tr>'
    +S.deletedLog.slice().reverse().map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(proj(x.projectId).name)+'</td><td>'+fmt(x.createdAt)+'</td><td>'+fmt(x.deletedAt)+'</td><td>'+x.postponements+'</td></tr>').join('')+'</table>')
    :'<div class="empty">Niciun task șters. Ține-o tot așa.</div>';
  h+='</div>';
  return h;
}

function addProject(){const n=document.getElementById('np-name').value.trim();if(!n)return;S.projects.push({id:'p'+Date.now(),name:n,color:COLORS[S.projects.length%COLORS.length]});save();render();}
function setCfg(k,v){S.cfg[k]=+v;save();render();}
function moveProject(id,dir){
  const i=S.projects.findIndex(x=>x.id===id);const j=i+dir;
  if(i<0||j<0||j>=S.projects.length)return;
  const p=S.projects.splice(i,1)[0];S.projects.splice(j,0,p);
  save();render();
}
function renameProject(id){
  const p=S.projects.find(x=>x.id===id);if(!p)return;
  const v=prompt('Nume nou pentru proiect:',p.name);
  if(v&&v.trim()){p.name=v.trim();save();render();}
}
function deleteProject(id){
  const p=S.projects.find(x=>x.id===id);if(!p)return;
  if(S.projects.length<=1){alert('Trebuie să rămână cel puțin un proiect.');return;}
  const n=S.tasks.filter(x=>x.projectId===id).length;
  if(n){alert('Proiectul „'+p.name+'” are '+n+' taskuri (active sau în arhivă). Mută-le întâi pe alt proiect (✏️ pe task), apoi șterge-l.');return;}
  if(!confirm('Ștergi proiectul „'+p.name+'”?'))return;
  S.projects=S.projects.filter(x=>x.id!==id);save();render();
}

    +'<select id="m-type"><option value="normal">Normal (azi)</option><option value="urgent">Prioritar</option><option value="imbunatatit">De îmbunătățit</option><option value="waiting">În așteptare</option></select>'
    +'<button class="ghost" onclick="morningAdd()">+</button></div>'
    +'<div id="m-list"></div><div id="m-hint"></div>'
    +'<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="ghost" onclick="closeMorning()">Sar peste azi</button>'
    +'<button class="primary" onclick="closeMorning()">Începe ziua →</button></div>'
    +'</div></div>';
  document.getElementById('modal-root').innerHTML=h;
  setTimeout(()=>{const e=document.getElementById('m-title');if(e)e.focus();},50);
}
function morningAdd(){
  const ti=document.getElementById('m-title');const title=ti.value.trim();if(!title)return;
  const matches=S.tasks.filter(x=>x.status==='active'&&x.createdAt<today()&&similar(title,x.title)>=0.5);
  const tk=addTask(title,document.getElementById('m-proj').value,document.getElementById('m-type').value,null,null,null,true);
  morningItems.push(tk);ti.value='';
  document.getElementById('m-list').innerHTML=morningItems.map(x=>'<div class="day-item">• '+esc(x.title)+' <span class="mini">('+TYPE_LABEL[x.type]+')</span></div>').join('');
  if(matches.length)document.getElementById('m-hint').innerHTML='<div class="hint">💡 „'+esc(title)+'” seamănă cu taskuri mai vechi: '+matches.map(m=>'„'+esc(m.title)+'”').join(', ')+'. E bine să închizi taskurile istorice, nu să le dublezi.</div>';
}
function closeMorning(){document.getElementById('modal-root').innerHTML='';render();if(reviewPending)showReview();}

/* ---------- revizuire săptămânală ---------- */
let reviewPending=null,REV=null;
function reviewDueKey(){
  const wd=new Date(today()+'T12:00:00').getDay();
  if(wd===5)return weekStart(0);      // vineri: revizuirea săptămânii curente
  if(wd===1)return weekStart(-1);     // luni: recuperare, dacă vineri a fost sărită
  return null;
}
function startReviewManual(){reviewPending=weekStart(0);REV=null;showReview();}
function revStagnant(){
  return S.tasks.filter(x=>x.status==='active'&&x.type!=='waiting'&&!REV.skipped.includes(x.id)
    &&(((x.rolls||0)>=3)||((x.postponements||[]).filter(p=>p.auto).length>=2)));
}
function revOldWait(){
  const lim=addDays(today(),-14);
  return S.tasks.filter(x=>x.status==='active'&&x.type==='waiting'&&!REV.skipped.includes(x.id)&&x.createdAt<=lim);
}
function showReview(){
  if(!reviewPending)return;
  if(!REV)REV={step:1,skipped:[]};
  let body='',title='';
  if(REV.step===1){
    const st=revStagnant();
    title='Pasul 1/3 · Taskuri stagnante';
    body=st.length?'<p class="mini" style="margin-bottom:10px">Astea se tot amână. Decide pentru fiecare — nu le mai lăsa să se târască:</p>'
      +st.map(x=>'<div class="rev-item"><b>'+esc(x.title)+'</b> <span class="mini">· '+esc(proj(x.projectId).name)+' · amânat de '+((x.rolls||0)+(x.postponements||[]).filter(p=>p.auto).length)+' ori</span>'
        +'<div class="row" style="margin-top:6px"><button class="ghost" onclick="revUrgent(\''+x.id+'\')">🔴 Fă-l prioritar</button>'
        +'<button class="ghost" onclick="revIdea(\''+x.id+'\')">💡 Mută în Idei</button>'
        +'<button class="ghost" onclick="revDel(\''+x.id+'\')">✕ Șterge</button>'
        +'<button class="ghost" onclick="revSkip(\''+x.id+'\')">Lasă-l</button></div></div>').join('')
      :'<p>Nimic stagnant. 🎉</p>';
  } else if(REV.step===2){
    const w=revOldWait();
    title='Pasul 2/3 · În așteptare de peste 2 săptămâni';
    body=w.length?'<p class="mini" style="margin-bottom:10px">Aștepți de prea mult. Escaladezi sau închizi:</p>'
      +w.map(x=>'<div class="rev-item"><b>'+esc(x.title)+'</b> <span class="mini">· de la '+esc(x.delegatedTo||'—')+' · din '+fmt(x.createdAt)+'</span>'
        +'<div class="row" style="margin-top:6px"><button class="ghost" onclick="revUrgent(\''+x.id+'\')">🔴 Preiau eu (prioritar)</button>'
        +'<button class="ghost" onclick="revClose(\''+x.id+'\')">✓ Închide</button>'
        +'<button class="ghost" onclick="revSkip(\''+x.id+'\')">Mai aștept</button></div></div>').join('')
      :'<p>Nimic vechi în așteptare. 🎉</p>';
  } else {
    const wk=weekDates();let tot=0;let rows='';
    for(const p of S.projects){
      let n=0;wk.forEach(d=>{(S.dayLog[d]?.completed||[]).forEach(c=>{if(c.projectId===p.id)n++;});});
      tot+=n;if(n)rows+='<div class="day-item"><span class="proj-dot" style="background:'+p.color+'"></span>'+esc(p.name)+': <b>'+n+'</b></div>';
    }
    title='Pasul 3/3 · Săptămâna ta';
    body='<p style="margin-bottom:8px">Ai finalizat <b style="color:var(--green)">'+tot+'</b> taskuri în ultimele 7 zile.</p>'+(rows||'<p class="mini">Săptămână liniștită.</p>');
  }
  document.getElementById('modal-root').innerHTML=
    '<div class="modal-bg"><div class="modal"><h2>🧹 Revizuire săptămânală</h2><div class="sub">'+title+'</div>'+body
    +'<div class="row" style="margin-top:14px;justify-content:flex-end">'
    +(REV.step<3?'<button class="ghost" onclick="finishReview()">Sar peste tot</button><button class="primary" onclick="REV.step++;showReview()">Continuă →</button>'
      :'<button class="primary" onclick="finishReview()">Încheie revizuirea ✓</button>')
    +'</div></div></div>';
}
function finishReview(){S.lastReview=reviewPending;reviewPending=null;REV=null;save();document.getElementById('modal-root').innerHTML='';render();}
function revUrgent(id){const tk=S.tasks.find(x=>x.id===id);if(tk){if(tk.type==='waiting')tk.delegatedTo=null;tk.type='urgent';tk.renewCount=0;tk.alert=false;tk.deadline=addWorkDays(today(),2);save();}showReview();}
function revIdea(id){
  const tk=S.tasks.find(x=>x.id===id);if(tk){
    S.ideas.push({id:'i'+Date.now(),text:tk.title+((tk.checklist||[]).length?'\n'+tk.checklist.map(c=>'- '+c.txt).join('\n'):''),createdAt:today()});
    S.tasks=S.tasks.filter(x=>x.id!==id);save();
  }showReview();
}
function revDel(id){
  const tk=S.tasks.find(x=>x.id===id);if(tk){
    S.deletedLog.push({title:tk.title,projectId:tk.projectId,createdAt:tk.createdAt,deletedAt:today(),postponements:(tk.postponements||[]).length,lastDeadline:tk.deadline,reason:'revizuire'});
    S.tasks=S.tasks.filter(x=>x.id!==id);save();
  }showReview();
}
function revClose(id){
  const tk=S.tasks.find(x=>x.id===id);if(tk){
    tk.status='done';tk.doneAt=today();
    dl(today()).completed.push({id:tk.id,title:tk.title,projectId:tk.projectId,type:tk.type});save();
  }showReview();
}
function revSkip(id){REV.skipped.push(id);showReview();}

/* ---------- boot ---------- */
function render(){
  const v=document.getElementById('view');
  if(VIEWALL){
    const real=S;S=mergedData();
    try{
      v.innerHTML='<div class="mini" style="margin-bottom:8px">👥 <b>Total</b> — toți utilizatorii împreună. Orice modificare ajunge automat la utilizatorul căruia îi aparține taskul; la adăugare alegi utilizatorul din selector.</div>'
        +(TAB==='setari'?'<div class="card"><div class="empty">Setările sunt per utilizator — comută pe un utilizator din selector.</div></div>'
        :TAB==='azi'?viewAzi():TAB==='calendar'?viewCalendar():TAB==='toate'?viewToate():TAB==='proiecte'?viewProiecte():TAB==='mindmap'?viewMindmap():TAB==='obiceiuri'?viewObiceiuri():TAB==='abonamente'?viewAbonamente():TAB==='idei'?viewIdei():viewRapoarte());
    }finally{S=real;}
  }
  else v.innerHTML=TAB==='azi'?viewAzi():TAB==='calendar'?viewCalendar():TAB==='toate'?viewToate():TAB==='proiecte'?viewProiecte():TAB==='mindmap'?viewMindmap():TAB==='obiceiuri'?viewObiceiuri():TAB==='abonamente'?viewAbonamente():TAB==='idei'?viewIdei():TAB==='rapoarte'?viewRapoarte():viewSetari();
  document.getElementById('notifs').innerHTML='';
  renderStorageBar();
  if(TAB==='mindmap'&&!VIEWALL)setTimeout(mmAfterRender,0);
  document.querySelectorAll('.tab[data-tab="obiceiuri"]').forEach(e=>e.style.display=(!VIEWALL&&modsOn('habits'))?'':'none');
  document.querySelectorAll('.tab[data-tab="abonamente"]').forEach(e=>e.style.display=(!VIEWALL&&modsOn('subs'))?'':'none');
  const pb=document.getElementById('prof-box');
  if(pb&&ROOT)pb.innerHTML='<select onchange="switchProfile(this.value)" style="padding:4px 8px;font-size:13px;margin-left:8px">'
    +ROOT.profiles.map(p=>'<option value="'+p.id+'"'+(p.id===ROOT.active&&!VIEWALL?' selected':'')+'>👤 '+esc(p.name)+'</option>').join('')
    +'<option value="__all"'+(VIEWALL?' selected':'')+'>👥 Total</option></select>';
}
/* ---------- Total editabil: id-urile compuse „utilizator§id” sunt rezolvate către proprietar ---------- */
let OWNER_CTX=null;
function ownerOf(id){if(typeof id!=='string'||id.indexOf('§')<0)return null;const k=id.indexOf('§');const pr=ROOT&&ROOT.profiles.find(p=>p.id===id.slice(0,k));return pr?{pr,rid:id.slice(k+1)}:null;}
function aid(id){return (VIEWALL&&OWNER_CTX)?OWNER_CTX+'§'+id:id;}
function wrapOwner(name){
  const f=window[name];if(typeof f!=='function')return;
  window[name]=function(id){
    const o=ownerOf(id);if(!o)return f.apply(this,arguments);
    const args=Array.prototype.slice.call(arguments);args[0]=o.rid;
    const real=S,prev=OWNER_CTX;S=o.pr.data;OWNER_CTX=o.pr.id;migrateOne(S);
    try{return f.apply(this,args);}finally{S=real;OWNER_CTX=prev;}
  };
}
['completeTask','deleteTask','editDeadline','editTask','saveEdit','togglePropose','toggleCheck','depAdd','depRemove','inlineSave','postponeTomorrow',
 'promoteIdea','deleteIdea','editIdea','saveIdeaEdit','editProject','saveProject','dropApply'].forEach(wrapOwner);
/* gesturi pe telefon */
(function(){
  let st=null,lp=null;
  const task=e=>{let n=e.target;while(n&&n!==document.body){if(n.classList&&n.classList.contains('task')&&n.getAttribute('data-id'))return n;n=n.parentNode;}return null;};
  document.addEventListener('touchstart',e=>{const n=task(e);if(!n)return;const t=e.touches[0];st={n,x:t.clientX,y:t.clientY,id:n.getAttribute('data-id'),moved:false};
    lp=setTimeout(()=>{if(st&&!st.moved){const id=st.id;st=null;if(navigator.vibrate)navigator.vibrate(30);editTask(id);}},550);},{passive:true});
  document.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0];const dx=t.clientX-st.x,dy=t.clientY-st.y;
    if(Math.abs(dy)>Math.abs(dx)||Math.abs(dx)>6){if(Math.abs(dy)>Math.abs(dx)){clearTimeout(lp);st=null;return;}st.moved=true;clearTimeout(lp);}
    if(st.moved){st.n.style.transform='translateX('+Math.max(-120,Math.min(120,dx))+'px)';st.n.classList.toggle('swipe-r',dx>60);st.n.classList.toggle('swipe-l',dx<-60);}},{passive:true});
  document.addEventListener('touchend',e=>{clearTimeout(lp);if(!st)return;const n=st.n,id=st.id;const t=e.changedTouches[0];const dx=t.clientX-st.x;st=null;
    n.style.transform='';n.classList.remove('swipe-r','swipe-l');
    if(dx>90)completeTask(id);else if(dx<-90)postponeTomorrow(id);},{passive:true});
  document.addEventListener('touchcancel',()=>{clearTimeout(lp);if(st){st.n.style.transform='';st.n.classList.remove('swipe-r','swipe-l');}st=null;},{passive:true});
})();
main();
</script>
